services:
  erp-api-gateway:
    container_name: erp-api-gateway
    build: .
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0
      - AUTH_SERVICE_URL=http://erp-auth-service:8081
      - LAYOUT_SERVICE_URL=http://erp-layout:8082
    networks:
      - erp-platform

networks:
  erp-platform:
    external: true
    name: erp-platform
